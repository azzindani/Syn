function streamClose() {
  if (es) es.close();
  es = null;
  sseOK = false;
}

async function tail() {
  // Whichever transport is live owns the timeline. Two of them writing to
  // it means every row twice.
  if (sseOK) return;
  try {
    const r = await fetch("/events?since=" + tailAt);
    if (!r.ok) return;
    const d = await r.json();
    // The first look at a log is a catch-up, not a replay. The saved
    // transcript already has everything that finished, and `refresh()`
    // has just drawn it; redrawing the same steps out of the progress
    // log put the whole run on screen twice, which is exactly what a
    // page reopened after a run looked like. Adopt the cursor, draw
    // nothing, and show what happens from here.
    if (tailSrc === null) {
      tailSrc = d.source;
      tailAt = d.n;
      liveState(d.running);
      return;
    }
    if (d.source !== tailSrc) {
      // A different run took over. That one IS worth seeing from its
      // beginning, because no transcript of it has been drawn.
      liveSource(d.source);
      if (!d.source) return;
      // Awaited, not fired and forgotten: `void tail()` resolved the
      // outer call before the inner one had set the cursor, so the
      // bootstrap opened the stream at since=0 while the first poll was
      // still drawing, and the stream replayed what the poll had drawn.
      return await tail();
    }
    tailAt = d.n;
    for (const line of d.lines || []) liveStep(line);
    liveState(d.running);
  } catch { /* a dropped poll is not worth a message; the next one retries */ }
}

const HINT_IDLE = "<kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line";

function thinking(on) {
  busy = on;
  document.body.classList.toggle("busy", on);
  $("send").disabled = on;
  $("hint").innerHTML = on ? '<span class="spin"></span>&nbsp; Syn is working…' : HINT_IDLE;
  document.querySelector(".chat.on")?.classList.toggle("working", on);
  // Nothing to pace when the stream is up: the server pushes, and the
  // pace is whatever the run is doing.
  if (sseOK) return;
  clearInterval(tailTimer);
  tailTimer = setInterval(tail, on ? 700 : 2000);
  void tail();
}

async function send() {
  const v = box.value.trim();
  if (!v || busy) return;
  box.value = ""; box.style.height = "auto";
  // Paint the turn at once: a chat that goes blank while the model thinks
  // feels broken even when it is working.
  clearBlank();
  tl.appendChild(el("div", "you", v));
  if ($("title").textContent === "New chat") $("title").textContent = v.split("\n")[0].slice(0, 80);
  scrollEnd();
  thinking(true);
  try {
    const r = verdict(await cli("say " + v.replace(/\n/g, " ")));
    await refresh();
    if (r.answered && r.retried) {
      tl.appendChild(el("div", "note", "That model was busy, so " + r.retried + " answered instead"));
    } else if (!r.answered && r.failure) {
      tl.appendChild(el("div", "fail", r.failure));
    }
    await loadChats();
  } catch (e) {
    tl.appendChild(el("div", "fail", "Console unreachable: " + e.message));
    $("sidefoot").classList.add("down");
  } finally {
    thinking(false);
    // A turn can attach or lose a hand, so the pill is only honest if it is
    // re-read afterwards rather than left as it was at boot.
    await hands();
    scrollEnd();
    box.focus();
  }
}

async function decide(yes) {
  if (!pending || busy) return;
  showAsk(null);
  thinking(true);
  try { await cli(yes ? "approve" : "deny not now"); await refresh(); }
  finally { thinking(false); }
}

// What is connected, said as the applications themselves: "Excel · Word"
// with their tiles, not "2 hands". A hand that claims everything shows as
// one neutral tile rather than pretending to know which apps it will get.
async function hands() {
  try {
    const lines = (await cli("hands")).split("\n").filter(l => l.startsWith("HAND "));
    const keys = [];
    for (const l of lines) {
      const claims = (l.match(/claims=(\S+)/) || [])[1] || "any";
      for (const c of claims.split(",")) {
        const k = c === "any" ? "other" : appKey(c);
        if (!keys.includes(k)) keys.push(k);
      }
    }
    const p = $("hands");
    p.classList.toggle("live", lines.length > 0);
    const st = p.querySelector(".stack");
    st.textContent = "";
    for (const k of keys.slice(0, 4)) st.appendChild(tile(k, "sm"));
    const names = keys.map(k => (APPS[k] || APPS.other).name);
    p.querySelector(".lbl").textContent = !lines.length ? "No apps connected"
      : names.length <= 2 ? names.join(" · ") : `${names.length} apps connected`;
    p.title = lines.length ? "Connected: " + names.join(", ") : "Connect an app";
    $("sidefoot").classList.remove("down");
  } catch {
    $("sidefoot").classList.add("down");
  }
}

box.addEventListener("input", () => {
  box.style.height = "auto";

});
box.addEventListener("keydown", e => {

});
$("send").onclick = send;
$("ok").onclick = () => decide(true);
$("no").onclick = () => decide(false);
$("task").onchange = e => { slotTitle(); cli("task " + e.target.value); };
$("new").onclick = async () => { await cli("chat new"); await loadChats(); await refresh(); closeSideOnPhone(); box.focus(); };
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (id && id !== current && !busy) void openChat(id);
});
const pop = $("pop");
function closePop() { pop.classList.remove("on"); $("hands").setAttribute("aria-expanded", "false"); }

// Collapsed state is a per-viewer convenience, so localStorage is the right

/* ---------------- theme ----------------
   System, light or dark, pinned per viewer. "System" follows the OS live,
   so a laptop that flips to dark at sunset takes the page with it. */
const darkQuery = matchMedia("(prefers-color-scheme: dark)");
function setTheme(pref) {
  pref = pref === "light" || pref === "dark" ? pref : "system";
  const root = document.documentElement;
  root.dataset.pref = pref;
  root.dataset.theme = pref === "system" ? (darkQuery.matches ? "dark" : "light") : pref;
  for (const b of $("theme").children) b.setAttribute("aria-pressed", String(b.dataset.pref === pref));
  try { localStorage.setItem("syn.theme", pref); } catch {}
  return pref;
}
darkQuery.addEventListener("change", () => {
  if (document.documentElement.dataset.pref === "system") setTheme("system");
});
for (const b of $("theme").children) b.onclick = () => setTheme(b.dataset.pref);
setTheme(document.documentElement.dataset.pref);
$("contrast").addEventListener("input", e => setContrast(e.target.value));

(async () => {
  try {
    // Read the requested thread before loadChats() rewrites the hash to
    // whatever the CLI considers current.
    const want = location.hash.slice(1);
    await loadSlots(); await loadWiring(); await loadChats();
    if (want && want !== current) await openChat(want); else await refresh();
    await hands();
  }
  catch (e) {
    tl.appendChild(el("div", "fail", "Cannot reach the console: " + e.message));
    $("sidefoot").classList.add("down");
  }
  box.focus();
  // Watch from the moment the page opens: whatever run is printing now is
  // the one worth showing, whoever started it. Last, because it touches
  // bindings declared further down and `let` has no hoisting to lean on.
  //
  // Both are started. The stream takes over on its `open` and stops the
  // poller; if it never opens, the poller is already carrying the page and
  // nobody sees a gap.
  wireMap();
  tailTimer = setInterval(tail, 2000);
  // Await the first poll so `tailSrc` and `tailAt` are set before the
  // stream connects: otherwise the stream's opening `source` frame names
  // a run the page does not think it is following, and it starts over.
  await tail();
  streamOpen();
})();

/* ---------------- the contrast dial ----------------
   docs/DIGEST-08 section 8. One function, three custom properties, and
   every colour in the app moves. No component knows it exists. */
function setContrast(v) {
  const n = Math.max(0, Math.min(200, Number(v) || 100));
  const r = document.documentElement.style;
  r.setProperty("--contrast-base", Math.min(n, 100) + "%");
  r.setProperty("--contrast-boost", Math.max(n - 100, 0) + "%");
  r.setProperty("--contrast-border-boost", Math.max(n - 100, 0) / 4 + "%");
  try { localStorage.setItem("contrast", String(n)); } catch { /* private window */ }
  const slider = $("contrast");
  if (slider && Number(slider.value) !== n) slider.value = String(n);
  return n;
}
try { const c = localStorage.getItem("contrast"); if (c) setContrast(c); } catch { /* fine */ }

/* ---------------- the banner stack ----------------
   Activity outranks urgency outranks notice, only the front one shows,
   the rest collapse behind a count. docs/DIGEST-08 section 6. */
const banners = new Map();
let bannersOpen = false;

function bannerRank(b) {
  if (b.priority === "activity") return 0;
  if (b.priority === "urgent" || b.variant === "error" || b.variant === "warning") return 1;
  return 2;
}

function setBanner(id, b) {
  if (!b) banners.delete(id); else banners.set(id, { id, ...b });
  drawBanners();
}

function drawBanners() {
  const host = $("banners");
  if (!host) return;
  host.textContent = "";
  const all = [...banners.values()].sort((a, b) => bannerRank(a) - bannerRank(b));
  if (!all.length) { bannersOpen = false; return; }
  const shown = bannersOpen ? all : all.slice(0, 1);
  for (const b of shown) host.appendChild(bannerRow(b));
  if (all.length > 1) {
    const more = el("button", null, bannersOpen ? "Show less" : `${all.length - 1} more`);
    more.id = "peek";
    more.type = "button";
    more.setAttribute("aria-expanded", String(bannersOpen));
    more.onclick = () => { bannersOpen = !bannersOpen; drawBanners(); };
    host.appendChild(more);
  }
}

function bannerRow(b) {
  const row = el("div", "bn");
  row.dataset.variant = b.variant || "info";
  row.dataset.bannerId = b.id;
  row.setAttribute("role", b.variant === "error" ? "alert" : "status");
  const ic = el("span", "ic");
  if (b.variant === "activity") ic.appendChild(el("span", "spin"));
  else ic.innerHTML = svg(b.variant === "error" ? "circle-alert" : b.variant === "warning" ? "alert" : "info", 15, 2.1);
  row.appendChild(ic);
  const bd = el("div", "bd");
  bd.appendChild(el("div", "ti", b.title));
  if (b.description) bd.appendChild(el("div", "ds", b.description));
  row.appendChild(bd);
  if (b.dismiss !== false) {
    const x = el("button", "xx");
    x.type = "button";
    x.setAttribute("aria-label", "Dismiss");
    x.innerHTML = svg("x", 13, 2.2);
    x.onclick = () => setBanner(b.id, null);
    row.appendChild(x);
  }
  return row;
}

/* ---------------- the step budget ----------------
   Says what will happen, not only where you are. The slot is held while
   the number is unknown so the send button beside it does not jump.
   docs/DIGEST-08 section 7. */
function setBudget(step, max) {
  const m = $("meter");
  if (!m) return;
  if (!max) { m.classList.add("holding"); return; }
  m.classList.remove("holding");
  const left = Math.max(0, max - step);
  const frac = Math.min(1, step / max);
  m.querySelector(".fill").style.width = (frac * 100).toFixed(1) + "%";
  m.querySelector(".nums").textContent = `${left} steps left`;
  m.dataset.near = frac > 0.8 ? "1" : "0";
  m.title = left === 0
    ? "The budget is spent; the run will stop after a closing summary."
    : `Step ${step} of ${max}. At ${max} the run stops and summarises what it did.`;
}

/* ---------------- the minimap ----------------
   One tick per user turn, in the gutter, tapering by distance from the
   pointer, with a preview and arrow-key navigation. Inert when the
   window is too narrow for a gutter, rather than overlaying the text.
   docs/DIGEST-08 section 5. */
let turns = [];
let mapAt = null;

function drawMap() {
  const strip = $("mapstrip");
  const map = $("map");
  if (!strip || !map) return;
  strip.textContent = "";
  // Two is the floor: a single tick says nothing a scrollbar does not.
  const room = scroll.clientWidth - 768 > 110;
  map.classList.toggle("ready", turns.length >= 2 && room);
  if (turns.length < 2 || !room) return;
  const span = Math.max(1, tl.scrollHeight);
  turns.forEach((t, i) => {
    const b = el("span", "tick");
    b.dataset.i = String(i);
    b.setAttribute("role", "option");
    b.setAttribute("aria-label", t.text.slice(0, 80));
    // Where this turn actually is, as a fraction of the whole
    // conversation. Two turns a screen apart get ticks a screen apart.
    const at = t.node ? t.node.offsetTop + t.node.offsetHeight / 2 : (i + 0.5) * (span / turns.length);
    b.style.top = Math.min(99, Math.max(1, (at / span) * 100)).toFixed(2) + "%";
    strip.appendChild(b);
  });
  // The preview must not sit on top of the conversation. Give it what is
  // left of the gutter and no more.
  const peekRoom = Math.max(160, (scroll.clientWidth - 768) / 2 - 20);
  map.style.setProperty("--peek-room", peekRoom + "px");
  markMap(mapAt);
}

function markMap(i) {
  mapAt = i;
  const ticks = [...$("mapstrip").children];
  ticks.forEach((t, j) => {
    const d = i === null ? 9 : Math.abs(j - i);
    if (d <= 2) t.dataset.near = String(d); else delete t.dataset.near;
    t.classList.toggle("here", i !== null && j === i);
  });
  const peek = $("mappeek");
  if (i === null || !turns[i]) { peek.classList.remove("on"); return; }
  peek.classList.add("on");
  peek.querySelector(".n").textContent = `Turn ${i + 1} of ${turns.length}`;
  peek.querySelector(".t").textContent = turns[i].text;
  const tick = ticks[i];
  if (tick) {
    const strip = $("mapstrip");
    const top = strip.offsetTop + (tick.offsetTop || 0);
    peek.style.top = Math.max(8, Math.min(scroll.clientHeight - 110, top - 18)) + "px";
  }
}

function jumpMap(i) {
  const t = turns[i];
  if (t && t.node) t.node.scrollIntoView({ block: "center", behavior: "smooth" });
}

function wireMap() {
  const strip = $("mapstrip");
  strip.addEventListener("mousemove", e => {
    const ticks = [...strip.children];
    if (!ticks.length) return;
    let best = 0, bd = Infinity;
    ticks.forEach((t, j) => {
      const r = t.getBoundingClientRect();
      const d = Math.abs(e.clientY - (r.top + r.height / 2));
      if (d < bd) { bd = d; best = j; }
    });
    markMap(best);
  });
  strip.addEventListener("mouseleave", () => markMap(null));
  strip.addEventListener("click", () => { if (mapAt !== null) jumpMap(mapAt); });
  strip.addEventListener("focus", () => markMap(mapAt ?? 0));
  strip.addEventListener("blur", () => markMap(null));
  strip.addEventListener("keydown", e => {
    const last = turns.length - 1;
    const at = mapAt ?? 0;
    if (e.key === "ArrowDown") { e.preventDefault(); markMap(Math.min(last, at + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); markMap(Math.max(0, at - 1)); }
    else if (e.key === "Home") { e.preventDefault(); markMap(0); }
    else if (e.key === "End") { e.preventDefault(); markMap(last); }
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); if (mapAt !== null) jumpMap(mapAt); }
  });
  addEventListener("resize", drawMap);
}

/* A pasted log must not push the conversation off the screen. */
function foldIfLong(node) {
  requestAnimationFrame(() => {
    if (node.scrollHeight <= 176) return;
    node.classList.add("tall");
    const b = el("button", "morebtn", "Show full message");
    b.type = "button";
    b.onclick = () => {
      const open = node.classList.toggle("open");
      b.textContent = open ? "Show less" : "Show full message";
    };
    node.after(b);
  });
}

/* ---------------- observation surface ----------------
   Everything above is script-scoped. `let` and `const` do not create
   properties on `window`, so none of it is reachable from the devtools
   console or from a test — and a live view whose state cannot be observed
   is one whose "it is real-time now" claim nobody can check. The first
   version of the stream specs read `window.sseOK`, got `undefined`, and
   failed for that reason alone.

   Deliberately small, and deliberately read-mostly: the writers are the
   ones a test needs to force a transport or stage a state, and each is
   something the page already does to itself. */
window.live = {
  /** Is the server pushing, rather than the page asking? */
  get sse() { return sseOK; },
  get streaming() { return !!es && es.readyState === EventSource.OPEN; },
  get polling() { return tailTimer !== null; },
  get cursor() { return tailAt; },
  get source() { return tailSrc; },
  /** Rows currently on the timeline, as a human reads them. */
  get rows() {
    return [...document.querySelectorAll(".act")].map(e => ({
      text: e.querySelector(".nm")?.textContent ?? "",
      status: e.dataset.status ?? "",
      app: e.dataset.app ?? "",
    }));
  },
  /** Feed one CLI output line, exactly as a transport would. */
  step: line => liveStep(line),
  /** The minimap's ticks, one per user turn. */
  get turns() { return turns.map(t => t.text); },
  get mapReady() { return $("map").classList.contains("ready"); },
  /** The banner stack, front first. */
  get banners() {
    return [...document.querySelectorAll("#banners .bn")].map(b => ({
      variant: b.dataset.variant,
      title: b.querySelector(".ti")?.textContent ?? "",
    }));
  },
  banner: (id, b) => setBanner(id, b),
  /** Repaint the timeline from a transcript, as `refresh()` does. */
  render: (msgs, labels) => render(msgs, labels),
  budget: (step, max) => setBudget(step, max),
  contrast: v => setContrast(v),
  theme: p => setTheme(p),
  /** Show or clear the approval panel, as a PENDING line would. */
  ask: p => showAsk(p),
  fold: node => foldIfLong(node),
  /** Drop to polling, the way a proxy that eats event-streams would. */
  toPolling(ms) {
    streamClose();
    clearInterval(tailTimer);
    tailTimer = setInterval(tail, ms || 300);
  },
  /** Stop both transports, so a test measures rendering and not timing. */
  quiet() {
    streamClose();
    clearInterval(tailTimer);
    tailTimer = null;
    refresh = async () => {};
  },
};
</script>
</body></html>
