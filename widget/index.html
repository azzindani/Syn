<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Syn</title>
<style>
/* Semantic tokens, one set of names per theme, so nothing below knows which
   theme is on. Digested from t3code; see docs/DIGEST-05-t3code-ui.md. */
:root{
  --bg:#faf9f7; --surface:#fff; --raised:#fff; --line:#e7e3dc; --line-soft:#efece6;
  --fg:#1c1b19; --fg-muted:#6b6560; --fg-faint:#9a938b;
  --accent:#b4761f; --accent-soft:#f5ead6;
  --warn:#9a5b12; --warn-soft:#fdf3e3; --danger:#b4443a;
  --shadow:0 1px 2px rgb(0 0 0/.04), 0 8px 24px -16px rgb(0 0 0/.25);
  --radius:20px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141311; --surface:#1a1917; --raised:#211f1c; --line:#302d28; --line-soft:#26241f;
  --fg:#ece7dd; --fg-muted:#a49d90; --fg-faint:#7b746a;
  --accent:#e0a63c; --accent-soft:#2b2318;
  --warn:#e0a63c; --warn-soft:#2a2216; --danger:#d1604f;
  --shadow:0 1px 2px rgb(0 0 0/.3), 0 12px 28px -18px rgb(0 0 0/.6);
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;display:flex;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- sidebar ---------- */
#side{width:248px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;height:100vh}
#side header{padding:14px 14px 10px;display:flex;align-items:center;gap:8px}
#side header b{font-size:14px;letter-spacing:.2px}
#side header span{color:var(--fg-faint);font-size:11px}
#new{margin:0 10px 10px;padding:8px 11px;border:1px solid var(--line);border-radius:10px;
  display:flex;align-items:center;gap:8px;color:var(--fg-muted);transition:.12s}
#new:hover{border-color:var(--accent);color:var(--fg);background:var(--raised)}
#chats{flex:1;overflow-y:auto;padding:0 8px 8px}
.chat{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;flex-direction:column;gap:1px;
  position:relative;transition:background .12s}
.chat:hover{background:var(--raised)}
.chat.on{background:var(--accent-soft)}
.chat .ti{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .ag{font-size:11px;color:var(--fg-faint)}
.chat .del{position:absolute;right:6px;top:7px;opacity:0;color:var(--fg-faint);padding:2px 5px;
  border-radius:6px;font-size:14px;line-height:1}
.chat:hover .del{opacity:1}
.chat .del:hover{color:var(--danger);background:var(--bg)}
#side footer{border-top:1px solid var(--line-soft);padding:9px 12px;display:flex;gap:8px;align-items:center}
#side footer button{font-size:12px;color:var(--fg-muted);padding:4px 8px;border-radius:7px}
#side footer button:hover{background:var(--raised);color:var(--fg)}
#killbtn:hover{color:var(--danger)}

/* ---------- main ---------- */
main{flex:1;display:flex;flex-direction:column;height:100vh;min-width:0}
#top{height:46px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px;
  border-bottom:1px solid var(--line-soft)}
#title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;color:var(--fg-muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;
  white-space:nowrap}
#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
#tl{max-width:46rem;margin:0 auto;padding:26px 24px 8px;display:flex;flex-direction:column;gap:18px}

/* messages */
.turn{display:flex;flex-direction:column;gap:6px}
.you{align-self:flex-end;max-width:85%;background:var(--raised);border:1px solid var(--line);
  border-radius:16px 16px 4px 16px;padding:9px 13px;white-space:pre-wrap;word-break:break-word}
.bot{white-space:pre-wrap;word-break:break-word}
.bot p{margin:0 0 .7em}.bot p:last-child{margin:0}
.bot code{background:var(--raised);border:1px solid var(--line-soft);border-radius:5px;
  padding:1px 5px;font:12px ui-monospace,Consolas,monospace}

/* Tool calls: a thin list, never a stack of bubbles. Twelve of them must
   still read as one quiet paragraph of activity. */
.acts{display:flex;flex-direction:column;gap:1px;margin:-4px 0}
.act{display:flex;align-items:center;gap:7px;padding:2px 6px;border-radius:7px;
  font-size:12.5px;color:var(--fg-muted);cursor:pointer;text-align:left;width:100%;transition:background .12s}
.act:hover{background:var(--raised);color:var(--fg)}
.act .tw{color:var(--fg-faint);font-size:9px;width:8px;flex:none;transition:transform .12s}
.act.open .tw{transform:rotate(90deg)}
.act .nm{font-weight:500;color:var(--fg)}
.act .dt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.act .bad{margin-left:auto;flex:none;color:var(--danger);font-size:11px}
.body{margin:2px 0 6px 21px;border-left:2px solid var(--line);padding:4px 0 4px 10px;
  font:11.5px/1.55 ui-monospace,Consolas,monospace;color:var(--fg-muted);
  white-space:pre-wrap;word-break:break-word;max-height:16rem;overflow:auto}

.empty{margin:18vh auto 0;text-align:center;color:var(--fg-faint);max-width:30rem}
.empty h2{font-size:19px;color:var(--fg);font-weight:600;margin:0 0 6px}
.empty p{margin:0;font-size:13px}

/* ---------- composer ---------- */
#dock{flex:none;padding:10px 24px 18px}
#comp{max-width:46rem;margin:0 auto;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
#comp:focus-within{border-color:var(--accent)}
/* The approval attaches to the composer, where attention already is --
   never as a message that can scroll away. */
#ask{display:none;border-bottom:1px solid var(--line);background:var(--warn-soft);padding:10px 13px}
#ask.on{display:block}
#ask .hd{font-size:11px;color:var(--warn);font-weight:600;margin-bottom:5px}
#ask .cmd{font:12px ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;
  max-height:5rem;overflow:auto;color:var(--fg)}
#ask .wy{font-size:11.5px;color:var(--fg-muted);margin-top:5px}
#ask .btns{display:flex;gap:7px;margin-top:9px}
#ask button{font-size:12px;padding:5px 13px;border-radius:8px;border:1px solid var(--line)}
#ok{background:var(--accent);border-color:var(--accent);color:#1c1b19;font-weight:600}
#no:hover{border-color:var(--danger);color:var(--danger)}
#box{width:100%;border:0;outline:0;resize:none;background:none;padding:13px 14px 4px;
  max-height:40vh;min-height:46px;line-height:1.55}
#bar{display:flex;align-items:center;gap:8px;padding:5px 10px 9px 14px}
#bar select{font-size:11.5px;color:var(--fg-muted);background:none;border:1px solid var(--line);
  border-radius:7px;padding:3px 6px}
#send{margin-left:auto;width:30px;height:30px;border-radius:9px;background:var(--accent);color:#1c1b19;
  display:grid;place-items:center;font-size:15px;transition:.12s}
#send:disabled{opacity:.35}
#hint{max-width:46rem;margin:7px auto 0;font-size:11px;color:var(--fg-faint);text-align:center}
.spin{display:inline-block;width:9px;height:9px;border:1.5px solid var(--fg-faint);
  border-top-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:760px){#side{position:fixed;left:-248px;z-index:9;transition:left .16s}
  #side.show{left:0}#tl,#comp,#hint{max-width:none}}
</style></head>

<body>
<aside id="side">
  <header><b>Syn</b><span>one brain, many hands</span></header>
  <button id="new">＋&nbsp; New chat</button>
  <div id="chats"></div>
  <footer>
    <button id="handsbtn" title="Show attached hands">Hands</button>
    <button id="evbtn" title="Recent orchestration events">Events</button>
    <button id="killbtn" title="Latch the kill switch" style="margin-left:auto">Kill</button>
  </footer>
</aside>

<main>
  <div id="top">
    <button id="menu" class="pill" style="display:none">☰</button>
    <div id="title">New chat</div>
    <span style="flex:1"></span>
    <span class="pill" id="hands">no hands</span>
  </div>

  <div id="scroll"><div id="tl"></div></div>

  <div id="dock">
    <div id="comp">
      <div id="ask">
        <div class="hd" id="askhd">Command approval</div>
        <div class="cmd" id="askcmd"></div>
        <div class="wy" id="askwhy"></div>
        <div class="btns"><button id="ok">Approve</button><button id="no">Deny</button></div>
      </div>
      <textarea id="box" rows="1" placeholder="Ask Syn to do something with your open apps…"></textarea>
      <div id="bar">
        <select id="task" title="Which model slot to think with">
          <option value="routine">Terra · routine</option>
          <option value="skim">Luna · skim</option>
          <option value="code">Sol · code</option>
          <option value="deep">Astra · deep</option>
        </select>
        <button id="send" title="Send">↑</button>
      </div>
    </div>
    <div id="hint">Enter sends · Shift+Enter for a new line</div>
  </div>
</main>

<script>
"use strict";
// The page holds no logic of its own: it posts a command line to the local
// server, which types it into a real `cli` process, and renders the JSON the
// CLI prints back. It can only do what the CLI can do.
const TOKEN = "__SYN_TOKEN__";
const $ = id => document.getElementById(id);
const tl = $("tl"), box = $("box"), scroll = $("scroll");
let busy = false, current = null, pending = null;

async function cli(line) {
  const r = await fetch("/cmd", {
    method: "POST",
    headers: { "X-Syn-Token": TOKEN, "Content-Type": "text/plain" },
    body: line,
  });
  if (!r.ok) throw new Error(r.status + " " + (await r.text()));
  return (await r.json()).out || "";
}

// Receipts are line-prefixed; pull out the ones that carry JSON.
function tagged(out, tag) {
  return out.split("\n")
    .filter(l => l.startsWith(tag + " "))
    .map(l => { try { return JSON.parse(l.slice(tag.length + 1)); } catch { return null; } })
    .filter(Boolean);
}
function errorsIn(out) {
  return out.split("\n").filter(l => l.startsWith("ERROR") || l.startsWith("STOPPED"));
}

const ago = s => {
  const d = Math.max(0, Math.floor(Date.now() / 1000) - s);
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  return Math.floor(d / 86400) + "d ago";
};

const el = (t, cls, txt) => {
  const e = document.createElement(t);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
};

/* ---------------- sidebar ---------------- */
async function loadChats() {
  const out = await cli("chat list");
  const cur = (out.match(/current=(\S+)/) || [])[1];
  if (cur) current = cur;
  const list = $("chats");
  list.textContent = "";
  for (const c of tagged(out, "CHAT")) {
    const row = el("div", "chat" + (c.id === current ? " on" : ""));
    row.appendChild(el("div", "ti", c.title || "New chat"));
    row.appendChild(el("div", "ag", ago(c.updated)));
    const x = el("button", "del", "×");
    x.title = "Delete this chat";
    x.onclick = async e => {
      e.stopPropagation();
      await cli("chat del " + c.id);
      await loadChats();
      if (c.id === current) await refresh();
    };
    row.appendChild(x);
    row.onclick = async () => {
      if (busy) return;
      await cli("chat open " + c.id);
      current = c.id;
      await loadChats();
      await refresh();
    };
    list.appendChild(row);
  }
}

/* ---------------- timeline ---------------- */
// A tool call is one quiet row. Twelve of them stay a thin list rather than
// twelve blocks competing with the answer.
function activity(name, detail, body, failed) {
  const wrap = el("div");
  const b = el("button", "act");
  b.appendChild(el("span", "tw", "▶"));
  b.appendChild(el("span", "nm", name));
  b.appendChild(el("span", "dt", detail || ""));
  if (failed) b.appendChild(el("span", "bad", "failed"));
  const pre = el("div", "body", body || "(no output)");
  pre.style.display = "none";
  b.onclick = () => {
    const open = pre.style.display === "none";
    pre.style.display = open ? "block" : "none";
    b.classList.toggle("open", open);
  };
  wrap.appendChild(b);
  wrap.appendChild(pre);
  return wrap;
}

function render(msgs) {
  tl.textContent = "";
  if (!msgs.length) {
    const e = el("div", "empty");
    e.appendChild(el("h2", null, "What should Syn do?"));
    e.appendChild(el("p", null,
      "It drives the apps you already have open — Office, a browser, any window. Connect a hand, then ask."));
    tl.appendChild(e);
    return;
  }
  // Pair each tool result with the call that asked for it.
  const results = {};
  for (const m of msgs) if (m.role === "tool") results[m.id] = m.text;

  let acts = null;
  for (const m of msgs) {
    if (m.role === "system" || m.role === "tool") continue;
    if (m.role === "calls") {
      let calls = [];
      try { calls = JSON.parse(m.text); } catch { calls = []; }
      if (!acts) { acts = el("div", "acts"); tl.appendChild(acts); }
      for (const c of calls) {
        const fn = (c.function || {});
        let args = {};
        try { args = JSON.parse(fn.arguments || "{}"); } catch {}
        const detail = args.handle || args.program || args.selector || "";
        const out = results[c.id] || "";
        acts.appendChild(activity(fn.name || "tool", detail,
          "arguments: " + (fn.arguments || "{}") + "\n\n" + out,
          /refused|error|not on the allowlist/i.test(out)));
      }
      continue;
    }
    acts = null;
    const t = el("div", "turn");
    t.appendChild(el("div", m.role === "user" ? "you" : "bot", m.text));
    tl.appendChild(t);
  }
}

function showAsk(p) {
  pending = p;
  $("ask").classList.toggle("on", !!p);
  if (!p) return;
  $("askcmd").textContent = p.preview;
  // The model's stated reason is untrusted text: shown as a quote, never as
  // an instruction, and always beside the command it is arguing for.
  $("askwhy").textContent = p.why ? "model's reason: " + p.why : "";
}

async function refresh() {
  const out = await cli("chat msgs");
  const cur = (out.match(/chat=(\S+)/) || [])[1];
  if (cur) current = cur;
  const msgs = tagged(out, "MSG");
  render(msgs);
  const p = tagged(out, "PENDING")[0];
  showAsk(p || null);
  const first = msgs.find(m => m.role === "user");
  $("title").textContent = first ? first.text.split("\n")[0].slice(0, 70) : "New chat";
  scroll.scrollTop = scroll.scrollHeight;
}

function thinking(on) {
  busy = on;
  $("send").disabled = on;
  $("hint").innerHTML = on
    ? '<span class="spin"></span> working…'
    : "Enter sends · Shift+Enter for a new line";
}

async function send() {
  const v = box.value.trim();
  if (!v || busy) return;
  box.value = ""; box.style.height = "auto";
  // Paint the turn immediately: a chat that goes blank while the model
  // thinks feels broken even when it is working.
  const t = el("div", "turn"); t.appendChild(el("div", "you", v)); tl.appendChild(t);
  scroll.scrollTop = scroll.scrollHeight;
  thinking(true);
  try {
    const out = await cli("say " + v.replace(/\n/g, " "));
    const bad = errorsIn(out);
    await refresh();
    for (const b of bad) tl.appendChild(el("div", "bot", b));
    await loadChats();
  } catch (e) {
    tl.appendChild(el("div", "bot", "Console unreachable: " + e.message));
  } finally {
    thinking(false);
    scroll.scrollTop = scroll.scrollHeight;
    box.focus();
  }
}

async function decide(yes) {
  if (!pending || busy) return;
  showAsk(null);
  thinking(true);
  try {
    await cli(yes ? "approve" : "deny not now");
    await refresh();
  } finally { thinking(false); }
}

/* ---------------- wiring ---------------- */
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, window.innerHeight * 0.4) + "px";
});
box.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
$("send").onclick = send;
$("ok").onclick = () => decide(true);
$("no").onclick = () => decide(false);
$("task").onchange = e => cli("task " + e.target.value);
$("new").onclick = async () => { await cli("chat new"); await loadChats(); await refresh(); box.focus(); };
$("killbtn").onclick = async () => {
  await cli("kill");
  $("hands").textContent = "killed";
};
$("handsbtn").onclick = async () => {
  const out = await cli("hands");
  tl.appendChild(el("div", "bot", out.trim() || "no hands attached"));
  scroll.scrollTop = scroll.scrollHeight;
};
$("evbtn").onclick = async () => {
  const out = await cli("events");
  tl.appendChild(el("div", "bot", out.trim() || "no events yet"));
  scroll.scrollTop = scroll.scrollHeight;
};
$("menu").onclick = () => $("side").classList.toggle("show");
if (window.innerWidth <= 760) $("menu").style.display = "block";

async function hands() {
  try {
    const out = await cli("hands");
    const n = out.split("\n").filter(l => l.startsWith("HAND ")).length;
    $("hands").textContent = n ? n + (n === 1 ? " hand" : " hands") + " attached" : "no hands";
  } catch {}
}

(async () => {
  try { await loadChats(); await refresh(); await hands(); }
  catch (e) { tl.appendChild(el("div", "bot", "Cannot reach the console: " + e.message)); }
  box.focus();
})();
</script>
</body></html>
