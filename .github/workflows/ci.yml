name: ci
on: [push, pull_request]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: core
      - run: cargo test
        working-directory: core
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests

  # The whole stack against a real office engine: an MCP client drives the
  # real mcpgate, which starts sidecar-lo/lo_host.py, which starts
  # LibreOffice on real .xlsx/.docx/.pptx files. Everything above the C#
  # helper is exercised live; the C# itself still needs Windows + Office.
  # SYN_REQUIRE_LO=1 turns "skipped, LibreOffice missing" into a failure,
  # so this job cannot pass by checking nothing.
  libreoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: install LibreOffice and its Python bridge
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc libreoffice-writer libreoffice-impress python3-uno
      - run: cargo build --bins
        working-directory: core
      - name: live test through mcpgate against LibreOffice
        run: /usr/bin/python3 -m unittest discover -s tests -p test_lo_live.py -v
        env:
          AGENT_PYTHON: /usr/bin/python3
          SYN_REQUIRE_LO: "1"
      # The browser hand, live. Syn's own browser first (the mode people
      # get): it finds the runner's Chrome, starts it headless on a profile
      # of its own, drives a fixture site, and must leave no process behind.
      # Then a browser a person started and pointed Syn at (AGENT_CDP),
      # which Syn must attach to and never close. SYN_REQUIRE_BROWSER=1
      # fails rather than skips.
      - name: the fixture site's own checks
        run: /usr/bin/python3 -m unittest discover -s tests/browser -p test_site.py -v
      - name: live test of Syn's own browser through mcpgate
        run: /usr/bin/python3 -m unittest discover -s tests/browser -p test_browser_live.py -v
        env:
          SYN_REQUIRE_BROWSER: "1"
          # Newer runner images restrict the user namespaces Chrome's
          # sandbox is built on. This is a throwaway profile on fixtures.
          SYN_BROWSER_NO_SANDBOX: "1"
      - name: live test of an attached browser through mcpgate
        run: /usr/bin/python3 -m unittest discover -s tests -p test_cdp_live.py -v
        env:
          SYN_REQUIRE_BROWSER: "1"
          # Newer runner images restrict the user namespaces Chrome's
          # sandbox is built on. This is a throwaway profile on fixtures.
          SYN_BROWSER_NO_SANDBOX: "1"

  # The C# side drives Office through late-bound COM, so almost none of it
  # can run without Office installed -- but all of it has to compile, and
  # until now none of it was built here at all. Every break this project
  # has had in the sidecar was a compile error: a tuple containing
  # `dynamic` cannot be deconstructed, an MsoTriState is not a bool, an
  # escape mangled in transit. Those are exactly what a build catches.
  sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: build the Office host
        run: dotnet build sidecar-csharp/Host/Host.csproj -c Release --nologo
      - name: build the UIA host
        run: dotnet build sidecar-csharp/Uia/Uia.csproj -c Release --nologo
      # Syn's own window: the one project with a package (WebView2), so the
      # restore is part of what is checked.
      - name: build the window
        run: dotnet build sidecar-csharp/Window/Window.csproj -c Release --nologo

  # The Windows package a person downloads: console, CLI, MCP server and a
  # self-contained Office helper in one zip (scripts/package.ps1). Built on
  # every push, so any run's artifact is a build to try on a machine with
  # Office and no toolchain; published as a release on a v* tag.
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      # The runner image has no NSIS: without this step run #48 built only
      # the zip and still went green. -RequireInstaller makes that a failure.
      - name: install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: build the package
        shell: pwsh
        run: ./scripts/package.ps1 -RequireInstaller
      - uses: actions/upload-artifact@v4
        with:
          name: syn-windows
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*.zip
      - name: publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item dist/*-setup.exe).FullName (Get-Item dist/*.zip).FullName --title "Syn $env:GITHUB_REF_NAME" --generate-notes

  # The fixture, the scorers and the smoke scripts are PowerShell, and a
  # parse error in one of them is silent: the shell reports it and carries
  # on with the next command, so a setup step can simply not happen. That
  # has already cost this project a run. Parsing every script is cheap and
  # needs no Office.
  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: parse every PowerShell script
        shell: pwsh
        run: |
          $bad = 0
          Get-ChildItem -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\(node_modules|target|bin|obj)\\' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                $_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors -and $errors.Count) {
                $bad++
                Write-Host "FAIL $($_.FullName)"
                $errors | ForEach-Object { Write-Host "     $($_.Message)" }
              } else {
                Write-Host "ok   $($_.Name)"
              }
            }
          if ($bad) { throw "$bad script(s) do not parse" }
